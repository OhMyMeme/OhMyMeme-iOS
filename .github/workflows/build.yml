name: Build ipa

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build ad-hoc ipa
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/build-ipa.sh "$VERSION"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OhMyMeme-ipa
          path: dist/*.ipa